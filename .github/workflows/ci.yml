name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported line and the next supported LTS line.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run check
      - name: Validate with the Agent Skills reference validator
        if: matrix.node-version == 24
        env:
          SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        run: |
          for skill in skills/*/; do
            pipx run --spec "$SKILLS_REF" skills-ref validate "$skill"
          done
